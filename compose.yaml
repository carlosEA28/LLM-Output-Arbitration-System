services:
  api:
    build: .
    env_file: .env
    environment:
      ARBITRATION_DB_PATH: /app/data/arbitrations.sqlite3
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - arbitration_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  arbitration_data:
